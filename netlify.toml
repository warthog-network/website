# netlify.toml
[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "SAMEORIGIN"

[build]
  command = "npm run build"
  publish = "dist"

# Keep existing specific redirects (if these point to custom functions outside Astro SSR)
[[redirects]]
  from = "/api/account/:account/balance"
  to = "/.netlify/functions/account_balance/:account"
  status = 200
  force = true

[[redirects]]
  from = "/api/wallet/create"
  to = "/.netlify/functions/wallet_create"
  status = 200
  force = true

[[redirects]]
  from = "/api/wallet/derive-from-mnemonic"
  to = "/.netlify/functions/wallet_derive_from_mnemonic"
  status = 200
  force = true

[[redirects]]
  from = "/api/wallet/send"
  to = "/.netlify/functions/wallet_send"
  status = 200
  force = true

[[redirects]]
  from = "/api/tools/encode16bit/from_string/:fee"
  to = "/.netlify/functions/encode_fee/:fee"
  status = 200
  force = true

# Specific redirect for API proxy (adjust name if build shows different, e.g., api_proxy)
[[redirects]]
  from = "/api/proxy"
  to = "/.netlify/functions/api__proxy"
  status = 200
  force = true