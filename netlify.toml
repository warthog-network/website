# netlify.toml
[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "SAMEORIGIN"

[build]
  command = "npm run build"
  publish = "dist"
  environment = { NODE_VERSION = "24.3.0" }

# Build mark (src/components/BuildMark.astro) is auto-stripped when CONTEXT=production.
# It stays on for local dev and Netlify deploy-preview / branch-deploy builds.



# Wallet and explorer call the node directly. These paths must not reach
# the SSR function, or old clients and scanners keep billing invocations.
[[redirects]]
  from = "/api/*"
  to = "/api-disabled.json"
  status = 410
  force = true
