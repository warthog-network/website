# netlify.toml
[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "SAMEORIGIN"

[build]
  command = "npm run build"
  publish = "dist"

# Redirect for home page (root /)
[[redirects]]
  from = "/"
  to = "/.netlify/functions/index"  # Matches generated index function
  status = 200
  force = true

# Redirect for wallet page (/webwallet)
[[redirects]]
  from = "/webwallet"
  to = "/.netlify/functions/webwallet"  # Matches generated webwallet function
  status = 200
  force = true

# Redirect for API proxy
[[redirects]]
  from = "/api/proxy"
  to = "/.netlify/functions/api__proxy"  # Matches generated api__proxy function
  status = 200
  force = true

# Keep existing redirects for custom functions
[[redirects]]
  from = "/api/account/:account/balance"
  to = "/.netlify/functions/account_balance/:account"
  status = 200
  force = true

[[redirects]]
  from = "/api/wallet/create"
  to = "/.netlify/functions/wallet_create"
  status = 200
  force = true

[[redirects]]
  from = "/api/wallet/derive-from-mnemonic"
  to = "/.netlify/functions/wallet_derive_from_mnemonic"
  status = 200
  force = true

[[redirects]]
  from = "/api/wallet/send"
  to = "/.netlify/functions/wallet_send"
  status = 200
  force = true

[[redirects]]
  from = "/api/tools/encode16bit/from_string/:fee"
  to = "/.netlify/functions/encode_fee/:fee"
  status = 200
  force = true

# Optional catch-all (only if other routes 404; test without first)
